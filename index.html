<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>James Swartwood | Portfolio</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=" />

  <!-- Cache control headers -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <script>
    const cssLink = document.createElement('link');
    cssLink.rel = 'stylesheet';
    cssLink.href = `style.css?v=${Date.now()}`;
    document.head.appendChild(cssLink);
  </script>
  <!-- Puter.js integration for AI Chatbot -->
  <script src="https://js.puter.com/v2/"></script>
</head>
<body>
  <header id="top-nav">
    <div class="nav-left">
      <img id="nav-avatar" src="" alt="Profile Photo" />
      <div class="nav-meta">
        <h1 id="nav-name"></h1>
        <span id="nav-tags"></span> 
      </div>
    </div>
    <div class="nav-right">
      <a id="nav-resume" href="resume.pdf" class="contact-link" download>Resume</a>
      <a id="nav-linkedin" href="" target="_blank" rel="noopener" class="contact-link">LinkedIn</a>
      <button id="nav-contact-btn" class="btn-contact" onclick="openContactModal()">Get in Touch</button>
    </div>
  </header>

  <div class="page-layout">
    <aside id="sidebar">
      <nav class="sidebar-nav">
        <div class="sidebar-group">
          <button class="category-btn active" data-target="tab-summary">
            Professional Summary
          </button>
          <ul class="sub-nav-links" id="summary-subnav">
            <li><a href="#about-section">About</a></li>
            <li><a href="#experience-section">Work Experience</a></li>
            <li><a href="#volunteering-section">Volunteering</a></li>
            <li><a href="#honors-section">Honors & Awards</a></li>
          </ul>
        </div>
        <div class="sidebar-group">
          <button class="category-btn" data-target="tab-organizations">
            Organizations
          </button>
          <ul class="sub-nav-links" id="organizations-subnav" style="display: none;"></ul>
        </div>
      </nav>
    </aside>

    <main id="main-content">
      <div id="tab-summary" class="tab-pane active">
        <section id="about-section" class="content-section">
          <h2>About</h2>
          <div class="card" id="about-content"></div>
        </section>
        <section id="experience-section" class="content-section">
          <h2>Work Experience</h2>
          <div id="experience-container" class="card-list"></div>
        </section>
        <section id="volunteering-section" class="content-section">
          <h2>Volunteering</h2>
          <div id="volunteering-container" class="card-list"></div>
        </section>
        <section id="honors-section" class="content-section">
          <h2>Honors & Awards</h2>
          <div id="honors-container" class="card-list"></div>
        </section>
      </div>

      <div id="tab-organizations" class="tab-pane">
        <div id="organizations-categories-wrapper"></div>
      </div>
    </main>
  </div>

  <!-- Media Pop-up Modal -->
  <div id="media-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-overlay" onclick="closeModal()"></div>
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <img id="modal-img" src="" alt="Media preview" />
      <h3 id="modal-title"></h3>
      <p id="modal-desc"></p>
      <a id="modal-link" href="" class="btn-contact hidden">Action</a>
    </div>
  </div>

  <!-- Contact Form Pop-up Modal -->
  <div id="contact-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-overlay" onclick="closeContactModal()"></div>
    <div class="modal-content form-modal-content">
      <button class="modal-close" onclick="closeContactModal()">&times;</button>
      <h3 id="contact-title" style="margin-bottom: 1rem; color: #fff;">Get in Touch</h3>
      <iframe id="contact-iframe" class="inverted-form" src="" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
    </div>
  </div>

  <!-- Chatbot UI -->
  <button id="chatbot-toggle" onclick="toggleChatbot()">Ask AI</button>
  <div id="chatbot-window" class="hidden">
    <div id="chatbot-header">
      <h4>Portfolio AI Assistant</h4>
      <button onclick="toggleChatbot()">&times;</button>
    </div>
    <div id="chatbot-messages"></div>
    <div id="chatbot-input-area">
      <input type="text" id="chatbot-input" placeholder="Ask about my experience..." onkeypress="handleChatEnter(event)" />
      <button onclick="sendChatMessage()">Send</button>
    </div>
  </div>

  <script>
    const jsScript = document.createElement('script');
    jsScript.src = `main.js?v=${Date.now()}`;
    document.body.appendChild(jsScript);
  </script>
</body>
</html>
